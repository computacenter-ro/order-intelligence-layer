name: Build & push images

# Builds the two deployment images and pushes them to GHCR, so the VM only ever
# PULLS. Building on the VM would need ~4 vCPUs (torch + the Next bundle) and
# would put the private-registry npm token on the box; neither is necessary.
#
# Two images:
#   ghcr.io/<owner>/oil-app        — all Python services (differ only by command)
#   ghcr.io/<owner>/oil-dashboard  — the Next.js app
#
# Trigger: pushes to prep-for-prod / dev / main that touch something an image
# contains, plus manual dispatch. Docs-only pushes don't rebuild.
#
# Images are pushed to GHCR **and**, for pushes to `main`, to ACR — because the
# Azure Container Apps authenticate against ACR only (they were created with ACR
# pull credentials and hold no GitHub token). Pushing directly removes the manual
# `az acr import` hop that otherwise sat between a merge and a deployable image.
on:
  push:
    branches: [prep-for-prod, dev, main]
    paths:
      - "Dockerfile"
      - "requirements*.txt"
      - "ai_service/**"
      - "backend/**"
      - "pipeline/**"
      - "shared/**"
      - "alembic.ini"
      - "dashboard/**"
      - ".github/workflows/build-images.yml"
  workflow_dispatch:
    inputs:
      public_url:
        description: "Backend base URL the dashboard bundle calls (blank = the DEFAULT_* below)"
        required: false
        default: ""
      ws_url:
        description: "Absolute wss:// URL for the WebSocket (blank = the DEFAULT_* below)"
        required: false
        default: ""

env:
  REGISTRY: ghcr.io
  ACR_LOGIN_SERVER: croildevweu01.azurecr.io

  # --- Dashboard URL defaults -------------------------------------------------
  # NEXT_PUBLIC_* are inlined into the browser bundle at BUILD time (every page is
  # a client component), so the dashboard image is environment-specific and these
  # cannot be supplied at deploy time — see dashboard/Dockerfile.
  #
  # These default to the DEPLOYED Azure hostnames rather than to the Dockerfile's
  # relative "/api" and "/ws". Those relative paths are correct only behind a
  # single-origin reverse proxy (docker-compose.prod.yml + Caddy); this deployment
  # runs dashboard and backend as SEPARATE Container Apps on DIFFERENT hostnames,
  # where a relative "/api" makes the browser call the dashboard itself and 404.
  # An automatic build with blank inputs used to produce exactly that image.
  #
  # Note the API URL carries NO "/api" suffix: backend/main.py mounts its routers
  # at the root (/auth/login, /alerts, ...), and lib/api.ts appends the path
  # itself. The WS URL must use the wss:// scheme — lib/useWebSocket.ts only
  # treats a value as absolute when it starts ws:// or wss://, and resolves
  # anything else against the DASHBOARD's own origin.
  DEFAULT_PUBLIC_URL: https://ca-oil-backend-dev-weu.wittyisland-62bad157.westeurope.azurecontainerapps.io
  DEFAULT_WS_URL: wss://ca-oil-backend-dev-weu.wittyisland-62bad157.westeurope.azurecontainerapps.io/ws

jobs:
  app:
    name: oil-app (Python services)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # required to push to GHCR
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # GITHUB_TOKEN is injected by Actions — no secret to manage.
          password: ${{ secrets.GITHUB_TOKEN }}

      # ACR is the registry the Container Apps actually pull from. Logging in via
      # the SAME service principal deploy.yml uses (AZURE_CREDENTIALS) means no
      # extra secret and no ACR admin password stored in GitHub.
      #
      # Only on `main`: feature branches have nothing to deploy to, and pushing
      # every branch would fill ACR (Basic SKU, 10 GB) with images nothing pulls.
      - name: Log in to Azure
        if: github.ref == 'refs/heads/main'
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to ACR
        if: github.ref == 'refs/heads/main'
        run: az acr login --name croildevweu01

      # One `images:` list per case, because docker/metadata-action has no way to
      # drop a registry conditionally — an empty line would emit a bare tag.
      - name: Image metadata (main → GHCR + ACR)
        id: meta_main
        if: github.ref == 'refs/heads/main'
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/oil-app
            ${{ env.ACR_LOGIN_SERVER }}/oil-app
          tags: |
            type=ref,event=branch
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Image metadata (other branches → GHCR only)
        id: meta_branch
        if: github.ref != 'refs/heads/main'
        uses: docker/metadata-action@v5
        with:
          # Lowercased by the action: GHCR rejects uppercase in a repository name
          # and the org has a capital letter risk.
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/oil-app
          tags: |
            type=ref,event=branch
            type=sha,format=long

      - name: Select metadata
        id: meta
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            echo "tags<<EOF"   >> "$GITHUB_OUTPUT"
            echo "${{ steps.meta_main.outputs.tags }}"   >> "$GITHUB_OUTPUT"
            echo "EOF"         >> "$GITHUB_OUTPUT"
            echo "labels<<EOF" >> "$GITHUB_OUTPUT"
            echo "${{ steps.meta_main.outputs.labels }}" >> "$GITHUB_OUTPUT"
            echo "EOF"         >> "$GITHUB_OUTPUT"
          else
            echo "tags<<EOF"   >> "$GITHUB_OUTPUT"
            echo "${{ steps.meta_branch.outputs.tags }}"   >> "$GITHUB_OUTPUT"
            echo "EOF"         >> "$GITHUB_OUTPUT"
            echo "labels<<EOF" >> "$GITHUB_OUTPUT"
            echo "${{ steps.meta_branch.outputs.labels }}" >> "$GITHUB_OUTPUT"
            echo "EOF"         >> "$GITHUB_OUTPUT"
          fi

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GitHub-hosted cache: the torch layer is ~200 MB compressed and
          # otherwise re-downloads on every run.
          cache-from: type=gha,scope=oil-app
          cache-to: type=gha,scope=oil-app,mode=max

  dashboard:
    name: oil-dashboard (Next.js)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Azure
        if: github.ref == 'refs/heads/main'
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to ACR
        if: github.ref == 'refs/heads/main'
        run: az acr login --name croildevweu01

      - name: Image metadata (main → GHCR + ACR)
        id: meta_main
        if: github.ref == 'refs/heads/main'
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/oil-dashboard
            ${{ env.ACR_LOGIN_SERVER }}/oil-dashboard
          tags: |
            type=ref,event=branch
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Image metadata (other branches → GHCR only)
        id: meta_branch
        if: github.ref != 'refs/heads/main'
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/oil-dashboard
          tags: |
            type=ref,event=branch
            type=sha,format=long

      - name: Select metadata
        id: meta
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            echo "tags<<EOF"   >> "$GITHUB_OUTPUT"
            echo "${{ steps.meta_main.outputs.tags }}"   >> "$GITHUB_OUTPUT"
            echo "EOF"         >> "$GITHUB_OUTPUT"
            echo "labels<<EOF" >> "$GITHUB_OUTPUT"
            echo "${{ steps.meta_main.outputs.labels }}" >> "$GITHUB_OUTPUT"
            echo "EOF"         >> "$GITHUB_OUTPUT"
          else
            echo "tags<<EOF"   >> "$GITHUB_OUTPUT"
            echo "${{ steps.meta_branch.outputs.tags }}"   >> "$GITHUB_OUTPUT"
            echo "EOF"         >> "$GITHUB_OUTPUT"
            echo "labels<<EOF" >> "$GITHUB_OUTPUT"
            echo "${{ steps.meta_branch.outputs.labels }}" >> "$GITHUB_OUTPUT"
            echo "EOF"         >> "$GITHUB_OUTPUT"
          fi

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ./dashboard
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # NEXT_PUBLIC_* are BUILD args: Next inlines them into the browser
          # bundle, so they cannot be set at deploy time.
          #
          # A manual run's inputs win; otherwise these fall back to DEFAULT_*
          # (the deployed Azure hostnames — see the env block at the top). They
          # deliberately do NOT fall back to the Dockerfile's relative /api and
          # /ws: those are correct only behind a single-origin reverse proxy, and
          # this deployment splits dashboard and backend across two hostnames, so
          # a relative /api makes the browser call the dashboard and 404.
          build-args: |
            NEXT_PUBLIC_API_URL=${{ inputs.public_url || env.DEFAULT_PUBLIC_URL }}
            NEXT_PUBLIC_WS_URL=${{ inputs.ws_url || env.DEFAULT_WS_URL }}
          # The private @computacenter-ro/style-guide package needs a registry
          # token. Passed as a build SECRET (not an arg) so it never appears in
          # the build log or `docker history` — matches dashboard/Dockerfile's
          # `--mount=type=secret,id=npm_token`. Reuses the NODE_AUTH_TOKEN secret
          # that ci.yml already relies on.
          secrets: |
            npm_token=${{ secrets.NODE_AUTH_TOKEN }}
          cache-from: type=gha,scope=oil-dashboard
          cache-to: type=gha,scope=oil-dashboard,mode=max
