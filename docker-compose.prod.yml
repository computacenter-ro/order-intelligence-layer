# Order Intelligence Layer — PRODUCTION compose (Azure VM + Docker).
#
# Standalone file: use INSTEAD of docker-compose.yml, not merged with it.
#
#   docker compose -f docker-compose.prod.yml --profile app up -d
#
# Differences from the dev compose, and why:
#
#  * ONE ingress. Only `caddy` publishes host ports (80/443). Every other
#    service is reachable solely on the internal Docker network. The dev file
#    publishes postgres/redis/rabbitmq/collector/ai-service/backend/dashboard to
#    the host — including Redis with no password — which is fine on a laptop and
#    not on a VM with a public IP. Not publishing 8000 is also what makes the
#    backend's --forwarded-allow-ips=* safe.
#  * Single origin. Caddy serves the dashboard and the backend under one
#    hostname, so the session cookie is same-site and the dashboard bundle is
#    built with relative URLs (see the `dashboard` build args).
#  * Survives a reboot / long run. restart: unless-stopped everywhere (not
#    on-failure, which does not restart after a host reboot), healthchecks with
#    service_healthy gating, and log rotation on every service.
#
# Required in .env on the VM (see .env.example):
#   PUBLIC_HOST, ACME_EMAIL, POSTGRES_PASSWORD, JWT_SECRET,
#   ADMIN_PASSWORD_HASH, AUTH_COOKIE_SECURE=true, DASHBOARD_URL,
#   AZURE_AI_FOUNDRY_*, TEAMS_WEBHOOK_*, NPM_TOKEN (dashboard build only)
#
# ⚠ DO NOT copy a development .env onto the VM unchanged. Two services load it
# wholesale via `env_file`, and env_file values WIN over the `environment:`
# defaults written below. A leftover `DASHBOARD_URL=http://localhost:3000` or
# `ES_URL=http://localhost:9200` silently replaces the correct value here — the
# stack comes up healthy and the Teams cards link to localhost / the poller reads
# the wrong host. Write the VM's .env from .env.example, don't copy your laptop's.

x-logging: &logging
  # Docker's json-file driver is UNBOUNDED by default. These services log a line
  # per emitted log line (mock-services) and per poll cycle, so a multi-day run
  # would fill the VM disk. 10M x 3 caps each service at ~30 MB.
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # --- Ingress ---------------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    container_name: oil-caddy
    restart: unless-stopped
    logging: *logging
    ports:
      - "80:80"      # required for the ACME HTTP-01 challenge + http->https redirect
      - "443:443"
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?PUBLIC_HOST must be set (the public DNS name)}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # caddy_data holds the issued TLS certificates and ACME account key. It MUST
      # persist: without it every restart re-requests the certificate and Let's
      # Encrypt's rate limit (5 identical certs/week) locks you out of new certs.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
      dashboard:
        condition: service_healthy

  # --- Infrastructure --------------------------------------------------------
  # No `ports:` on any of these — internal network only.
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: oil-rabbitmq
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  redis:
    image: redis:7-alpine
    container_name: oil-redis
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data

  postgres:
    image: postgres:16-alpine
    container_name: oil-postgres
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-oil}
      # No dev default: a public VM must not run on the password "oil".
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-oil}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-oil} -d ${POSTGRES_DB:-oil}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # --- Migrations (run once, then exit) --------------------------------------
  migrate:
    profiles: ["app"]
    build: .
    image: oil-app
    restart: "no"
    logging: *logging
    command: alembic upgrade head
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-oil}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-oil}
    depends_on:
      postgres:
        condition: service_healthy

  # --- Log collector ---------------------------------------------------------
  collector:
    profiles: ["app"]
    build: .
    image: oil-app
    restart: unless-stopped
    logging: *logging
    command: uvicorn pipeline.mock_es.app:app --host 0.0.0.0 --port 9200
    environment:
      # In-memory ring buffer capacity. Set explicitly rather than relying on the
      # default so the retention/memory tradeoff is visible here: at 2 flows/min
      # (~85k lines/day) 200k lines is ~2.4 days of history and ~115 MB resident.
      MOCK_ES_MAX_LOGS: ${MOCK_ES_MAX_LOGS:-200000}
    # The image has no curl/wget, so healthchecks use Python's urllib.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:9200/health',timeout=3).status==200 else sys.exit(1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M

  # --- Mock services (log emitters) -----------------------------------------
  mock-services:
    profiles: ["app"]
    image: oil-app
    restart: unless-stopped
    logging: *logging
    command: python -m pipeline.services.run_all
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      ES_URL: http://collector:9200
    depends_on:
      rabbitmq:
        condition: service_healthy
      # service_healthy, not service_started: these emitters POST every log line
      # to the collector, so starting before it accepts connections loses logs.
      collector:
        condition: service_healthy

  # --- AI service ------------------------------------------------------------
  ai-service:
    profiles: ["app"]
    image: oil-app
    restart: unless-stopped
    logging: *logging
    command: python -m ai_service.main
    # env_file so the tuning knobs the dev compose could not reach are settable
    # without editing this file: AZURE_AI_FOUNDRY_API_VERSION (a wrong value means
    # 100% LLM fallback), AZURE_AI_FOUNDRY_DEPLOYMENT_CHAT, SEMCACHE_*, RAGINDEX_*.
    env_file:
      - path: .env
        required: false
    environment:
      ES_URL: http://collector:9200
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      API_HOST: 0.0.0.0        # so the backend can reach /summarize-journey + /index
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8100/health',timeout=3).status==200 else sys.exit(1)"]
      interval: 15s
      timeout: 10s
      retries: 5
      # Long: startup loads the sentence-transformers encoder (semantic cache +
      # retrieval index) before the API serves. A short start_period would mark a
      # healthy service unhealthy and restart-loop it.
      start_period: 180s
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      collector:
        condition: service_healthy
    deploy:
      resources:
        limits:
          # CPU torch + a MiniLM encoder. Generous headroom; lower once measured.
          memory: 3G

  # --- Backend ---------------------------------------------------------------
  backend:
    profiles: ["app"]
    image: oil-app
    restart: unless-stopped
    logging: *logging
    # --proxy-headers: Caddy terminates TLS and forwards plain http, so without
    # this uvicorn treats every request as insecure — the Secure session cookie is
    # mishandled (login succeeds, then bounces back to the login screen) and any
    # generated URL comes out http:// and is blocked as mixed content.
    # forwarded-allow-ips=* is safe ONLY because port 8000 is not published; if it
    # is ever exposed, narrow this to Caddy's subnet.
    command: >
      uvicorn backend.main:app --host 0.0.0.0 --port 8000
      --proxy-headers --forwarded-allow-ips=*
    env_file:
      # TEAMS_WEBHOOK_*, DASHBOARD_URL, JWT/admin secrets, ENTRA_*. The glob is
      # what carries the webhooks, so a NEW channel needs nothing here — only a
      # line in the VM's .env. Six live channels, all fed by `alert.new` and
      # nothing else: _NETWORKING, _DEVOPS, _BACKEND, _DATABASE, _BUSINESS
      # (source="ai" + department="business" — the pipeline correctly rejected an
      # order) and _FALLBACK (source="fallback" — LLM down). _REPORTS carries the
      # 09:00 + 17:00 reports and no alert traffic — renamed from _GENERAL, whose
      # meaning had moved three times (per-journey cards posted there until they
      # were dropped at thousands a day). See
      # backend/teams.py::channel_for. Do NOT list them under `environment:`:
      # an unset ${VAR:-} default there would shadow .env.
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-oil}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-oil}
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      # The twice-daily report's watermark (`teams:digest:last_sent`) lives in
      # Redis — see backend/report.py. This is the ONLY thing in the backend that
      # needs Redis, which is why it was missing here: until the report existed,
      # Redis belonged to the AI service alone. Without it the code falls back to
      # `redis://localhost:6379/0`, and inside a container `localhost` is the
      # container itself — every cycle logs "Error 111 connecting to
      # localhost:6379" and no report is ever sent. The failure is loud in the log
      # but silent in Teams, which is the combination worth guarding against.
      REDIS_URL: redis://redis:6379/0
      AI_SERVICE_URL: http://ai-service:8100
      # Single origin behind Caddy, so this is same-origin and CORS is not really
      # in play — set correctly anyway (backend/main.py currently HARDCODES
      # http://localhost:3000; see the note at the bottom of this file).
      CORS_ORIGINS: https://${PUBLIC_HOST}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      DASHBOARD_URL: ${DASHBOARD_URL:-https://${PUBLIC_HOST}}
      # Entra ID is the deployment's sign-in path. Password login defaults to ON
      # in the app (for local dev), and the built-in admin hash is bcrypt("admin")
      # — so leaving it enabled here would be a documented way around SSO.
      # Default to off, overridable if the client secret expires mid-demo.
      PASSWORD_LOGIN_ENABLED: ${PASSWORD_LOGIN_ENABLED:-false}
      # Must match the Azure app registration BYTE-FOR-BYTE, and Entra requires
      # HTTPS for non-localhost redirect URIs. Derived from PUBLIC_HOST so it
      # cannot drift from the host Caddy holds the certificate for.
      ENTRA_REDIRECT_URI: ${ENTRA_REDIRECT_URI:-https://${PUBLIC_HOST}/auth/entra/callback}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8000/health',timeout=3).status==200 else sys.exit(1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      # Required, not best-effort: the report loop reads its watermark from Redis
      # on its very first cycle, and a Redis that is not up yet turns that into a
      # logged error rather than a report.
      redis:
        condition: service_healthy
      # The backend calls the AI service on journey completion (summaries) and
      # pushes to its retrieval index (backend/consumers.py). Both are
      # best-effort, so this is not required for correctness — but without it,
      # journeys completing during the AI service's ~3min model load get
      # summary=None permanently, which on a fresh deploy is the first few
      # journeys anyone looks at.
      ai-service:
        condition: service_healthy

  # --- Dashboard -------------------------------------------------------------
  dashboard:
    profiles: ["app"]
    build:
      context: ./dashboard
      secrets:
        - npm_token
      # NEXT_PUBLIC_* are BUILD args: Next inlines them into the browser bundle,
      # so a runtime `environment:` entry has no effect (see dashboard/Dockerfile).
      # RELATIVE values because Caddy serves everything on one origin — which also
      # means this image has no hostname baked in and works for any PUBLIC_HOST.
      args:
        NEXT_PUBLIC_API_URL: /api
        NEXT_PUBLIC_WS_URL: /ws
    restart: unless-stopped
    logging: *logging
    # node:20-alpine ships wget (the python image does not).
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:3000/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      backend:
        condition: service_healthy

  # --- Injector (continuous flow generation) --------------------------------
  # Long-running, unlike the dev file's one-shot `fire` profile: fires 2 scenarios
  # together, waits 60s, fires the next 2, cycling all scenarios.
  # NOTE: a restart resets the cycle to the first pair.
  injector:
    profiles: ["app"]
    image: oil-app
    restart: unless-stopped
    logging: *logging
    command: >
      python -m pipeline.injector.inject
      --mode continuous
      --interval ${INJECT_INTERVAL:-60}
      --count ${INJECT_COUNT:-2}
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    depends_on:
      rabbitmq:
        condition: service_healthy
      # Don't start firing before the emitters can consume batons and log.
      mock-services:
        condition: service_started
      collector:
        condition: service_healthy

volumes:
  rabbitmq_data:
  redis_data:
  postgres_data:
  caddy_data:      # TLS certificates — see the caddy service note; do not prune
  caddy_config:

secrets:
  npm_token:
    environment: NPM_TOKEN

# --- Known gaps this file cannot close --------------------------------------
# 1. CORS_ORIGINS above is set but NOT yet read: backend/main.py:129 hardcodes
#    allow_origins=["http://localhost:3000"]. Harmless while everything is
#    same-origin behind Caddy; must be made env-driven before any split-origin
#    deployment.
# 2. Collector restart still loses the logs emitted during the gap — that is
#    inherent to an in-memory store and is NOT recoverable. It is now at least
#    loud rather than silent: the collector reports oldest_timestamp on /health
#    and the poller warns and skips its watermark forward instead of quietly
#    draining empty windows. The affected journeys are still swept as TIMED_OUT,
#    so expect a burst of those in the logs after any collector restart.
# 3. Backups are available but NOT automatic: run ./scripts/backup_db.sh, and
#    cron it on the VM (see the header of that script).
