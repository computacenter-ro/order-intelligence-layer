# Order Intelligence Layer — infrastructure
# Usage: docker compose up -d
# Python services and the dashboard run natively in dev (see CLAUDE.md).

services:
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: oil-rabbitmq
    ports:
      - "5672:5672"     # AMQP -> amqp://guest:guest@localhost:5672/ (image default)
      - "15672:15672"   # management UI -> http://localhost:15672 (guest/guest)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  redis:
    image: redis:7-alpine
    container_name: oil-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data

  postgres:
    image: postgres:16-alpine
    container_name: oil-postgres
    ports:
      - "5432:5432"
    environment:
      # Sourced from .env (gitignored); defaults keep local dev zero-config.
      # Keep these in sync with DATABASE_URL in .env / settings.
      POSTGRES_USER: ${POSTGRES_USER:-oil}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-oil}
      POSTGRES_DB: ${POSTGRES_DB:-oil}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oil -d oil"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # --- Python apps (share one image; differ only in `command`) --------------
  # Enable with: docker compose --profile app up -d
  # (Left in a profile so `docker compose up -d` alone still starts infra only,
  # preserving the native-dev workflow.)

  # Migrations run once, then exit. Everything that touches the DB waits on it.
  migrate:
    profiles: ["app"]
    build: .
    image: oil-app
    command: alembic upgrade head
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-oil}:${POSTGRES_PASSWORD:-oil}@postgres:5432/${POSTGRES_DB:-oil}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  collector:
    profiles: ["app"]
    build: .
    image: oil-app
    command: uvicorn pipeline.mock_es.app:app --host 0.0.0.0 --port 9200
    ports:
      - "9200:9200"

  mock-services:
    profiles: ["app"]
    image: oil-app
    # Auto-restart if it loses the RabbitMQ startup race (the initial AMQP
    # connection doesn't retry; depends_on:service_healthy narrows but doesn't
    # eliminate the window). on-failure => restarts on non-zero exit only.
    restart: on-failure
    command: python -m pipeline.services.run_all
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      ES_URL: http://collector:9200
    depends_on:
      rabbitmq:
        condition: service_healthy
      collector:
        condition: service_started

  ai-service:
    profiles: ["app"]
    image: oil-app
    restart: on-failure          # same RabbitMQ startup-race guard as mock-services
    command: python -m ai_service.main
    ports:
      - "8100:8100"   # /semcache/stats + /summarize-journey reachable from the host
    environment:
      ES_URL: http://collector:9200
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      # /summarize-journey must be reachable by the backend container.
      API_HOST: 0.0.0.0
      # Azure creds come from .env (unset => LLM fallback mode).
      AZURE_AI_FOUNDRY_ENDPOINT: ${AZURE_AI_FOUNDRY_ENDPOINT:-}
      AZURE_AI_FOUNDRY_API_KEY: ${AZURE_AI_FOUNDRY_API_KEY:-}
      AZURE_AI_FOUNDRY_DEPLOYMENT_EXPLAINER: ${AZURE_AI_FOUNDRY_DEPLOYMENT_EXPLAINER:-}
      AZURE_AI_FOUNDRY_DEPLOYMENT_ROUTER: ${AZURE_AI_FOUNDRY_DEPLOYMENT_ROUTER:-}
      AZURE_AI_FOUNDRY_DEPLOYMENT_SUMMARY: ${AZURE_AI_FOUNDRY_DEPLOYMENT_SUMMARY:-}
      # LangSmith. TRACING/ENDPOINT/API_KEY are read by langchain-core itself to
      # WRITE traces; API_KEY + PROJECT are what langsmith_stats reads them back
      # with for GET /llm-stats. All unset => no traces written and /llm-stats
      # answers nulls (never an error).
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-}
      LANGSMITH_ENDPOINT: ${LANGSMITH_ENDPOINT:-}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-}
      # How hard the background refresher hits /runs/stats. Passed through so the
      # rate can be tuned from .env without rebuilding the image — which is the
      # whole point, since these two are what a 429 would send you to change.
      LLM_STATS_REFRESH_INTERVAL_SECONDS: ${LLM_STATS_REFRESH_INTERVAL_SECONDS:-60}
      LLM_STATS_STAGGER_SECONDS: ${LLM_STATS_STAGGER_SECONDS:-1.5}
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      collector:
        condition: service_started

  backend:
    profiles: ["app"]
    image: oil-app
    restart: on-failure          # same RabbitMQ startup-race guard as mock-services
    # --proxy-headers + --forwarded-allow-ips: honor X-Forwarded-Proto/-For from a
    # reverse proxy. A TLS terminator forwards PLAIN http over the internal network,
    # so without these uvicorn believes every request is insecure http and (a) the
    # Secure session cookie is mishandled — login appears to succeed then bounces
    # straight back to the login screen — and (b) any absolute URL it builds comes
    # out http:// and is blocked as mixed content. Harmless with no proxy in front
    # (the headers simply aren't present).
    #
    # "*" trusts the headers from any peer, which is safe ONLY because nothing
    # untrusted can reach this port: in the production compose the backend
    # publishes no host port and is reachable solely on the Docker network. If port
    # 8000 is ever published to the host, narrow this to the proxy's subnet.
    command: >
      uvicorn backend.main:app --host 0.0.0.0 --port 8000
      --proxy-headers --forwarded-allow-ips=*
    env_file:
      # TEAMS_WEBHOOK_* / DASHBOARD_URL for Teams notifications. The glob is what
      # carries the webhooks, so a NEW channel needs nothing here — only a line in
      # .env. Six are live, all fed by `alert.new` and nothing else: _NETWORKING,
      # _DEVOPS, _BACKEND, _DATABASE, _BUSINESS (source="ai" +
      # department="business" — business rejections) and _FALLBACK
      # (source="fallback" — the LLM was down). _REPORTS carries the 09:00 + 17:00
      # reports and NO alert traffic (it was _GENERAL, which had meant three
      # different things; journey completions posted there until they were dropped
      # at thousands of cards a day).
      # See backend/teams.py::channel_for.
      # Do NOT list them under `environment:` — an unset ${VAR:-} default there
      # would shadow the real value from .env.
      - path: .env
        required: false     # optional: stdout fallback when absent (e.g. CI/teammates)
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-oil}:${POSTGRES_PASSWORD:-oil}@postgres:5432/${POSTGRES_DB:-oil}
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      # The twice-daily report's watermark (`teams:digest:last_sent`) lives in
      # Redis — see backend/report.py. This is the ONLY thing in the backend that
      # needs Redis, which is exactly why it was missing: until the report existed,
      # Redis was the AI service's alone. Without it the code falls back to
      # `redis://localhost:6379/0`, and inside a container `localhost` is the
      # container itself, so every cycle logged
      # "Error 111 connecting to localhost:6379" and no report ever went out.
      REDIS_URL: redis://redis:6379/0
      # Reserved: the backend does NOT yet call /summarize-journey (see the TODO
      # in backend/journeys.py — summary is currently left None). Pre-wired by
      # service name so the integration works once that call is added.
      AI_SERVICE_URL: http://ai-service:8100
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  dashboard:
    profiles: ["app"]
    build:
      context: ./dashboard
      # NEXT_PUBLIC_* are BUILD args, not runtime env: Next inlines them into the
      # browser bundle during `npm run build`, so a runtime `environment:` entry
      # has no effect (see dashboard/Dockerfile). Absolute values here because this
      # dev/demo compose publishes ports directly with no reverse proxy; the
      # production compose builds with the relative defaults (/api, /ws) instead.
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_WS_URL: ws://localhost:8000/ws
      # NPM_TOKEN is passed as a build SECRET (not an arg), so it never appears
      # in the build log or `docker history`. Sourced from the NPM_TOKEN env var
      # via the top-level `secrets:` block below. Put NPM_TOKEN in .env
      # (gitignored) — it's a GitHub PAT with read:packages for @computacenter-ro.
      secrets:
        - npm_token
    ports:
      - "3000:3000"
    # No `environment:` for NEXT_PUBLIC_* — they are build args above. Setting them
    # here would look like configuration but change nothing at runtime.
    depends_on:
      backend:
        condition: service_started

  # One-shot: fire the 10 scenarios once the app is already running. Separate
  # profile so `--profile app up` starts the system WITHOUT auto-firing; fire on
  # demand with:  docker compose --profile fire run --rm injector
  #
  # No `depends_on` here on purpose: the app services live in the `app` profile,
  # and a `depends_on` pointing at them makes `--profile fire run` fail with
  # "depends on undefined service" (those services aren't in scope when only the
  # `fire` profile is active). The injector is always run manually AFTER the
  # stack is up, so the ordering guarantee isn't needed — it publishes a baton
  # to RabbitMQ (already healthy) which the running mock services then consume.
  injector:
    profiles: ["fire"]
    image: oil-app
    command: python -m pipeline.injector.inject --all
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/

volumes:
  rabbitmq_data:
  redis_data:
  postgres_data:

secrets:
  # The dashboard build reads this (GitHub Packages PAT) as a mounted secret,
  # never as a printed build arg. `environment:` sources it from the NPM_TOKEN
  # env var (set it in your shell or .env). Requires BuildKit (default in modern
  # Docker); Compose passes build secrets through automatically.
  npm_token:
    environment: NPM_TOKEN